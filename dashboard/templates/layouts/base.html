<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="apple-touch-icon" sizes="76x76" href="{{ url_for('static', filename='assets/img/apple-icon.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='assets/img/favicon.png') }}">

    <title>
        Fotobiorreator - {% block title %}{% endblock %} | AppSeed
    </title>

    <!--     Fonts and icons     -->
    <link href="https://fonts.googleapis.com/css?family=Poppins:200,300,400,600,700,800" rel="stylesheet"/>
    <link href="https://use.fontawesome.com/releases/v5.0.6/css/all.css" rel="stylesheet">
    <!-- Nucleo Icons -->
    <link href="{{ url_for('static', filename='assets/css/nucleo-icons.css') }}" rel="stylesheet"/>
    <!-- CSS Files -->
    <link href="{{ url_for('static', filename='assets/css/black-dashboard.css') }}?v=1.0.0" rel="stylesheet"/>
    <link href="{{ url_for('static', filename='assets/css/theme-switcher.css') }}" rel="stylesheet"/>
    <!-- CSS Just for demo purpose, don't include it in your project -->
    <!-- <link href="{{ url_for('static', filename='assets/demo/demo.css') }}" rel="stylesheet"/> -->
    <!-- SEU CSS PERSONALIZADO -->
    <link href="{{ url_for('static', filename='assets/css/custom.css') }}" rel="stylesheet"/>

    <script>
        (function () {
            try {
                var isLightTheme = localStorage.getItem("light_color") === "true";
                if (isLightTheme) {
                    document.documentElement.classList.add("preload-white-content");
                }
            } catch (error) {
                // Ignore storage access issues and keep the default theme.
            }
        })();
    </script>

    <!-- Specific Page CSS goes HERE  -->
    {% block stylesheets %}{% endblock stylesheets %}
        
</head>
<body class="">
    <script>
        (function () {
            if (document.documentElement.classList.contains("preload-white-content")) {
                document.body.classList.add("white-content");
                document.documentElement.classList.remove("preload-white-content");
            }
        })();
    </script>

    <div class="wrapper">

        {% include 'includes/sidebar.html' %}

        <div class="main-panel">

            {% include 'includes/navigation.html' %}

            {% block content %}{% endblock content %}

            <!-- {% include 'includes/footer.html' %} -->

        </div>
    </div>

    <!-- {% include 'includes/fixed-plugin.html' %} -->

    {% include 'includes/scripts.html' %}

    <!-- Specific Page JS goes HERE  -->
    {% block javascripts %}{% endblock javascripts %}

</body>
</html>
