<svg xmlns="http://www.w3.org/2000/svg" width="960" height="324" viewBox="0 0 960 324" role="img" aria-labelledby="title desc">
<title id="title">Analisar uma imagem do cultivo</title><desc id="desc">Fluxo de uso da tela Análise de biomassa. A seleção da região é opcional. A confiança do modelo não garante o acerto.</desc>
<rect width="960" height="324" rx="18" fill="#f1f5f9"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="32" y="44" font-size="25" font-weight="700" fill="#102d38">Analisar uma imagem do cultivo</text>
<text x="32" y="74" font-size="16" fill="#385460">Fluxo de uso da tela Análise de biomassa.</text>
<rect x="32" y="112" width="166" height="132" rx="12" fill="white" stroke="#b6cbd0"/>
<circle cx="56" cy="138" r="13" fill="#087e75"/>
<text x="56" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="white">1</text>
<text x="46" y="176" font-size="18" font-weight="700" fill="#102d38">Escolher</text>
<text x="46" y="202" font-size="14" fill="#385460">Envie uma imagem</text>
<text x="46" y="223" font-size="14" fill="#385460">do cultivo.</text>
<path d="M201 178 h9 m-4 -5 l5 5 -5 5" fill="none" stroke="#087e75" stroke-width="2"/>
<rect x="213" y="112" width="166" height="132" rx="12" fill="white" stroke="#b6cbd0"/>
<circle cx="237" cy="138" r="13" fill="#087e75"/>
<text x="237" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="white">2</text>
<text x="227" y="176" font-size="18" font-weight="700" fill="#102d38">Selecionar</text>
<text x="227" y="202" font-size="14" fill="#385460">Delimite a região</text>
<text x="227" y="223" font-size="14" fill="#385460">de interesse (ROI).</text>
<path d="M382 178 h9 m-4 -5 l5 5 -5 5" fill="none" stroke="#087e75" stroke-width="2"/>
<rect x="394" y="112" width="166" height="132" rx="12" fill="white" stroke="#b6cbd0"/>
<circle cx="418" cy="138" r="13" fill="#087e75"/>
<text x="418" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="white">3</text>
<text x="408" y="176" font-size="18" font-weight="700" fill="#102d38">Analisar</text>
<text x="408" y="202" font-size="14" fill="#385460">Execute a análise</text>
<text x="408" y="223" font-size="14" fill="#385460">e veja o resultado.</text>
<path d="M563 178 h9 m-4 -5 l5 5 -5 5" fill="none" stroke="#087e75" stroke-width="2"/>
<rect x="575" y="112" width="166" height="132" rx="12" fill="white" stroke="#b6cbd0"/>
<circle cx="599" cy="138" r="13" fill="#087e75"/>
<text x="599" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="white">4</text>
<text x="589" y="176" font-size="18" font-weight="700" fill="#102d38">Corrigir</text>
<text x="589" y="202" font-size="14" fill="#385460">Se necessário, salve</text>
<text x="589" y="223" font-size="14" fill="#385460">o rótulo correto.</text>
<path d="M744 178 h9 m-4 -5 l5 5 -5 5" fill="none" stroke="#087e75" stroke-width="2"/>
<rect x="756" y="112" width="166" height="132" rx="12" fill="white" stroke="#b6cbd0"/>
<circle cx="780" cy="138" r="13" fill="#087e75"/>
<text x="780" y="143" text-anchor="middle" font-size="14" font-weight="700" fill="white">5</text>
<text x="770" y="176" font-size="18" font-weight="700" fill="#102d38">Retreinar</text>
<text x="770" y="202" font-size="14" fill="#385460">Após 8 correções,</text>
<text x="770" y="223" font-size="14" fill="#385460">solicite o retreino.</text>
<text x="32" y="285" font-size="15" fill="#385460">A seleção da região é opcional. A confiança do modelo não garante o acerto.</text>
</g></svg>